a^2 + 5 &amp;=  a^2 + ab + bc + ca = (a + b)(a + c); \\\\\n            b^2 + 5 &amp;=  b^2 + ab + bc + ca = (b + a)(b + c); \\\\\n            c^2 + 5 &amp;=  c^2 + ab + bc + ca = (c + a)(c + b).\n\\end{aligned}\\]<\/span><\/p>\n<p>Nhân ba đẳng thức trên vế theo vế, ta được:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\n(a^2 + 5)(b^2 + 5)(c^2 + 5) &amp;=  \\big[(a + b)(b + c)(c + a)\\big]^2.\n\\end{aligned}\\]<\/span><\/p>\n<p>Do đó:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nA &amp;=  \\dfrac{(a^2 + 5)(b^2 + 5)(c^2 + 5)}{49} = \\left(\\dfrac{(a +\nb)(b + c)(c + a)}{7}\\right)^2.\n\\end{aligned}\\]<\/span><\/p>\n<p>Vì <span class=\"math inline\">\\(a, b, c \\in \\mathbb{Q}\\)<\/span> nên\n<span class=\"math inline\">\\(\\dfrac{(a + b)(b + c)(c + a)}{7} \\in\n\\mathbb{Q}\\)<\/span>, suy ra <span class=\"math inline\">\\(A\\)<\/span> là\nbình phương của một số hữu tỉ."}, {"id": 53, "isCoverSlide": false, "isTheorySlide": false, "title": "Bài 27", "type": "Essay", "level": "M3", "question": "Cho các số thực <span class=\"math inline\">\\(a, b, c\\)<\/span> thỏa mãn\nhệ điều kiện <span class=\"math inline\">\\(a^2 + 2b + 1 = 0\\)<\/span>,\n<span class=\"math inline\">\\(b^2 + 2c + 1 = 0\\)<\/span> và <span\nclass=\"math inline\">\\(c^2 + 2a + 1 = 0\\)<\/span>. Tính giá trị biểu thức\n<span class=\"math inline\">\\(P = a^{2023} + b^{2024} +\nc^{2025}\\)<\/span>.", "options": [], "correctIndex": 0, "tfItems": [], "correctAnswer": "", "essayItems": [{"label": "Đáp số / Kết quả", "text": ""}], "solution": "Cộng vế theo vế ba đẳng thức đã cho, ta được:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\na^2 + b^2 + c^2 + 2a + 2b + 2c + 3 &amp;=  0 \\\\\n            \\Leftrightarrow (a + 1)^2 + (b + 1)^2 + (c + 1)^2 &amp;=  0.\n\\end{aligned}\\]<\/span><\/p>\n<p>Vì <span class=\"math inline\">\\((a + 1)^2 \\ge 0\\)<\/span>, <span\nclass=\"math inline\">\\((b + 1)^2 \\ge 0\\)<\/span> và <span\nclass=\"math inline\">\\((c + 1)^2 \\ge 0\\)<\/span> với mọi <span\nclass=\"math inline\">\\(a, b, c\\)<\/span>, nên đẳng thức xảy ra khi và chỉ\nkhi <span class=\"math inline\">\\(a = b = c = -1\\)<\/span>.<br />\nKhi đó:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nP &amp;=  (-1)^{2023} + (-1)^{2024} + (-1)^{2025} \\\\\n            &amp;=  -1 + 1 - 1 = -1.\n\\end{aligned}\\]<\/span>"}, {"id": 54, "isCoverSlide": false, "isTheorySlide": false, "title": "Bài 28", "type": "Essay", "level": "M3", "question": "Cho các số <span class=\"math inline\">\\(a, b, c\\)<\/span> thỏa mãn\n<span class=\"math inline\">\\(a + b + c = 1\\)<\/span>, <span\nclass=\"math inline\">\\(a^2 + b^2 + c^2 = 1\\)<\/span> và <span\nclass=\"math inline\">\\(a^3 + b^3 + c^3 = 1\\)<\/span>. Tính giá trị của\n<span class=\"math inline\">\\(P = a^{2023} + b^{2024} +\nc^{2025}\\)<\/span>.", "options": [], "correctIndex": 0, "tfItems": [], "correctAnswer": "", "essayItems": [{"label": "Đáp số / Kết quả", "text": ""}], "solution": "Từ <span class=\"math inline\">\\((a + b + c)^2 = 1\\)<\/span> và <span\nclass=\"math inline\">\\(a^2 + b^2 + c^2 = 1\\)<\/span>, suy ra <span\nclass=\"math inline\">\\(ab + bc + ca = 0\\)<\/span>.<br />\nMặt khác, sử dụng hằng đẳng thức:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\na^3 + b^3 + c^3 - 3abc &amp;=  (a + b + c)\\left(a^2 + b^2 + c^2 - ab -\nbc - ca\\right) \\\\\n            \\Rightarrow 1 - 3abc &amp;=  1 \\cdot (1 - 0) \\Rightarrow abc\n= 0.\n\\end{aligned}\\]<\/span><\/p>\n<p>Do <span class=\"math inline\">\\(abc = 0\\)<\/span> nên ít nhất một trong\nba số <span class=\"math inline\">\\(a, b, c\\)<\/span> bằng <span\nclass=\"math inline\">\\(0\\)<\/span>; giả sử <span class=\"math inline\">\\(c =\n0\\)<\/span>, khi đó <span class=\"math inline\">\\(a + b = 1\\)<\/span> và\n<span class=\"math inline\">\\(ab = 0\\)<\/span>.<br />\nSuy ra một trong hai số <span class=\"math inline\">\\(a, b\\)<\/span> bằng\n<span class=\"math inline\">\\(0\\)<\/span> và số còn lại bằng <span\nclass=\"math inline\">\\(1\\)<\/span>.<br />\nVới một số bằng <span class=\"math inline\">\\(1\\)<\/span> và hai số bằng\n<span class=\"math inline\">\\(0\\)<\/span>, ta có:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nP &amp;=  a^{2023} + b^{2024} + c^{2025} = 1.\n\\end{aligned}\\]<\/span>"}, {"id": 55, "isCoverSlide": false, "isTheorySlide": false, "title": "Bài 29", "type": "Essay", "level": "M3", "question": "Cho <span class=\"math inline\">\\(a, b, c\\)<\/span> thỏa mãn <span\nclass=\"math inline\">\\(a + b + c = 0\\)<\/span> và <span\nclass=\"math inline\">\\(ab + bc + ca = 0\\)<\/span>. Tính giá trị biểu thức\n<span class=\"math inline\">\\(A = (a - 1)^{2021} + b^{2022} + (c +\n1)^{2023}\\)<\/span>.", "options": [], "correctIndex": 0, "tfItems": [], "correctAnswer": "", "essayItems": [{"label": "Đáp số / Kết quả", "text": ""}], "solution": "Từ <span class=\"math inline\">\\(a + b + c = 0\\)<\/span> và <span\nclass=\"math inline\">\\(ab + bc + ca = 0\\)<\/span>, ta có:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\na^2 + b^2 + c^2 &amp;=  (a + b + c)^2 - 2(ab + bc + ca) = 0.\n\\end{aligned}\\]<\/span><\/p>\n<p>Vì <span class=\"math inline\">\\(a^2 \\ge 0, b^2 \\ge 0, c^2 \\ge\n0\\)<\/span> nên <span class=\"math inline\">\\(a = b = c = 0\\)<\/span>.<br />\nThay vào biểu thức <span class=\"math inline\">\\(A\\)<\/span>:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nA &amp;=  (0 - 1)^{2021} + 0^{2022} + (0 + 1)^{2023} \\\\\n            &amp;=  -1 + 0 + 1 = 0.\n\\end{aligned}\\]<\/span>"}, {"id": 56, "isCoverSlide": false, "isTheorySlide": false, "title": "Bài 30", "type": "Essay", "level": "M3", "question": "Tìm tất cả các số nguyên dương <span class=\"math inline\">\\(n\\)<\/span>\nsao cho biểu thức <span class=\"math inline\">\\(n^2 + 9n - 2\\)<\/span> chia\nhết cho <span class=\"math inline\">\\(11\\)<\/span>.", "options": [], "correctIndex": 0, "tfItems": [], "correctAnswer": "", "essayItems": [{"label": "Đáp số / Kết quả", "text": ""}], "solution": "Biến đổi biểu thức theo modulo <span\nclass=\"math inline\">\\(11\\)<\/span>:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nn^2 + 9n - 2 &amp;=  (n^2 - 2n + 1) + 11n - 3 \\\\\n            &amp;=  (n - 1)^2 + 11n - 3.\n\\end{aligned}\\]<\/span><\/p>\n<p>Xét đồng dư theo modulo <span class=\"math inline\">\\(11\\)<\/span>:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nn^2 + 9n - 2 \\equiv (n - 1)^2 - 3 \\pmod{11}.\n\\end{aligned}\\]<\/span><\/p>\n<p>Để <span class=\"math inline\">\\((n - 1)^2 - 3 \\vdots 11\\)<\/span>, ta\ncần <span class=\"math inline\">\\((n - 1)^2 \\equiv 3\n\\pmod{11}\\)<\/span>.<br />\nKiểm tra bình phương các số dư khi chia cho <span\nclass=\"math inline\">\\(11\\)<\/span> (<span class=\"math inline\">\\(0^2, 1^2,\n2^2, 3^2, 4^2, 5^2\\)<\/span>): không có số nào chia <span\nclass=\"math inline\">\\(11\\)<\/span> dư <span\nclass=\"math inline\">\\(3\\)<\/span>.<br />\nVậy không tồn tại số nguyên dương <span class=\"math inline\">\\(n\\)<\/span>\nthỏa mãn điều kiện bài toán."}, {"id": 57, "isCoverSlide": false, "isTheorySlide": false, "title": "Bài 31", "type": "Essay", "level": "M3", "question": "Tìm giá trị nhỏ nhất của các biểu thức sau:<\/p>\n<p><ul class=\"extest-custom-enum\"><li class=\"extest-custom-item\"><span class=\"enum-custom-lbl\">a)<\/span><div class=\"enum-custom-body\"><span class=\"math inline\">\\(A = (x - 1)(x - 4)(x - 5)(x -\n8)\\)<\/span>;<\/div><\/li><li class=\"extest-custom-item\"><span class=\"enum-custom-lbl\">b)<\/span><div class=\"enum-custom-body\"><span class=\"math inline\">\\(B = x^4 - 6x^3 + 10x^2 - 6x +\n9\\)<\/span>.<\/div><\/li><\/ul>", "options": [], "correctIndex": 0, "tfItems": [], "correctAnswer": "", "essayItems": [{"label": "Ý a)", "text": ""}, {"label": "Ý b)", "text": ""}], "solution": "<ul class=\"extest-custom-enum\"><li class=\"extest-custom-item\"><span class=\"enum-custom-lbl\">a)<\/span><div class=\"enum-custom-body\">Ghép cặp <span class=\"math inline\">\\((x - 1)(x - 8) = x^2 - 9x +\n8\\)<\/span> và <span class=\"math inline\">\\((x - 4)(x - 5) = x^2 - 9x +\n20\\)<\/span>.<br />\nĐặt <span class=\"math inline\">\\(t = x^2 - 9x + 14\\)<\/span>, ta có:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nA &amp;=  (t - 6)(t + 6) = t^2 - 36 \\ge -36.\n\\end{aligned}\\]<\/span><\/p>\n<p>Giá trị nhỏ nhất của <span class=\"math inline\">\\(A\\)<\/span> là <span\nclass=\"math inline\">\\(-36\\)<\/span>, đạt được khi <span\nclass=\"math inline\">\\(x^2 - 9x + 14 = 0 \\Leftrightarrow (x - 2)(x - 7) =\n0 \\Leftrightarrow x \\in \\{2; 7\\}\\)<\/span>.<\/div><\/li><li class=\"extest-custom-item\"><span class=\"enum-custom-lbl\">b)<\/span><div class=\"enum-custom-body\">Phân tích đa thức thành tổng các bình phương:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nB &amp;=  (x^2 - 3x)^2 + (x - 3)^2 \\ge 0.\n\\end{aligned}\\]<\/span><\/p>\n<p>Giá trị nhỏ nhất của <span class=\"math inline\">\\(B\\)<\/span> là <span\nclass=\"math inline\">\\(0\\)<\/span>, đạt được khi <span\nclass=\"math inline\">\\(x = 3\\)<\/span>.<\/div><\/li><\/ul>"}, {"id": 58, "isCoverSlide": false, "isTheorySlide": false, "title": "Bài 32", "type": "Essay", "level": "M3", "question": "Tìm giá trị nhỏ nhất của các biểu thức:<\/p>\n<p><ul class=\"extest-custom-enum\"><li class=\"extest-custom-item\"><span class=\"enum-custom-lbl\">a)<\/span><div class=\"enum-custom-body\"><span class=\"math inline\">\\(A = x^4 - 6x^3 + 11x^2 + 12x +\n20\\)<\/span>;<\/div><\/li><li class=\"extest-custom-item\"><span class=\"enum-custom-lbl\">b)<\/span><div class=\"enum-custom-body\"><span class=\"math inline\">\\(B = (x + 3)^4 + (x - 7)^4\\)<\/span>.<\/div><\/li><\/ul>", "options": [], "correctIndex": 0, "tfItems": [], "correctAnswer": "", "essayItems": [{"label": "Ý a)", "text": ""}, {"label": "Ý b)", "text": ""}], "solution": "<ul class=\"extest-custom-enum\"><li class=\"extest-custom-item\"><span class=\"enum-custom-lbl\">a)<\/span><div class=\"enum-custom-body\">Biến đổi thành tổng các bình phương:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nA &amp;=  (x^2 - 3x - 2)^2 + 4(x - 1)^2 + 12 \\ge 12.\n\\end{aligned}\\]<\/span><\/p>\n<p>Giá trị nhỏ nhất của <span class=\"math inline\">\\(A\\)<\/span> là <span\nclass=\"math inline\">\\(12\\)<\/span> (tại các giá trị <span\nclass=\"math inline\">\\(x\\)<\/span> làm các bình phương đồng thời triệt\ntiêu nếu tồn tại).<\/div><\/li><li class=\"extest-custom-item\"><span class=\"enum-custom-lbl\">b)<\/span><div class=\"enum-custom-body\">Đặt <span class=\"math inline\">\\(u = x - 2\\)<\/span>, khi đó <span\nclass=\"math inline\">\\(x + 3 = u + 5\\)<\/span> và <span\nclass=\"math inline\">\\(x - 7 = u - 9\\)<\/span>; hoặc đặt <span\nclass=\"math inline\">\\(v = x + 3 \\Rightarrow x - 7 = v -\n10\\)<\/span>.<br />\nÁp dụng bất đẳng thức <span class=\"math inline\">\\((a^4 + b^4) \\ge\n\\dfrac{1}{8}(a + b)^4\\)<\/span> (hoặc khai triển thu gọn):<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\nB &amp;=  (x + 3)^4 + (7 - x)^4 \\ge \\dfrac{1}{8}\\big[(x + 3) + (7 -\nx)\\big]^4 = \\dfrac{10^4}{8} = 1250.\n\\end{aligned}\\]<\/span><\/p>\n<p>Dấu bằng xảy ra khi <span class=\"math inline\">\\(x + 3 = 7 - x\n\\Leftrightarrow x = 2\\)<\/span>. Vậy <span class=\"math inline\">\\(\\min B =\n1250\\)<\/span>.<\/div><\/li><\/ul>"}, {"id": 59, "isCoverSlide": false, "isTheorySlide": false, "title": "Bài 33", "type": "Essay", "level": "M3", "question": "Một cơ sở sản xuất bán sản phẩm với mức giá khởi điểm <span\nclass=\"math inline\">\\(45\\)<\/span> nghìn đồng mỗi chiếc thì lượng tiêu\nthụ trung bình đạt <span class=\"math inline\">\\(60\\)<\/span> chiếc mỗi\ntháng. Cứ mỗi lần tăng giá thêm <span class=\"math inline\">\\(2\\)<\/span>\nnghìn đồng/chiếc thì số lượng bán ra giảm đi <span\nclass=\"math inline\">\\(6\\)<\/span> chiếc/tháng. Biết chi phí sản xuất mỗi\nchiếc là <span class=\"math inline\">\\(27\\)<\/span> nghìn đồng. Xác định\ngiá bán (nghìn đồng) để \nthêm <span class=\"math inline\">\\(50\\text{ kg}\\)<\/span> mỗi tuần. Biết\nchi phí sản xuất và đóng gói là <span class=\"math inline\">\\(240\\)<\/span>\nnghìn đồng/kg. Tìm giá bán (nghìn đồng/kg) để lợi nhuận tuần đạt mức lớn\nnhất.", "options": [], "correctIndex": 0, "tfItems": [], "correctAnswer": "", "essayItems": [{"label": "Đáp số / Kết quả", "text": ""}], "solution": "Gọi <span class=\"math inline\">\\(m\\)<\/span> (<span\nclass=\"math inline\">\\(m \\ge 0\\)<\/span>) là số lần giảm giá <span\nclass=\"math inline\">\\(5\\)<\/span> nghìn đồng mỗi kg.<br />\nKhi đó:<\/p>\n<ul>\n<li><p>Giá bán mỗi kg là <span class=\"math inline\">\\(300 - 5m\\)<\/span>\n(nghìn đồng);<\/p><\/li>\n<li><p>Khối lượng tiêu thụ mỗi tuần là <span class=\"math inline\">\\(300 +\n50m\\)<\/span> (kg);<\/p><\/li>\n<li><p>Lợi nhuận trên mỗi kg là <span class=\"math inline\">\\((300 - 5m) -\n240 = 60 - 5m\\)<\/span> (nghìn đồng).<\/p><\/li>\n<\/ul>\n<p>Tổng lợi nhuận mỗi tuần là:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\n\\Pi(m) &amp;=  (60 - 5m)(300 + 50m) = 250(12 - m)(6 + m) \\\\\n            &amp;=  250\\left[81 - (m - 3)^2\\right] \\le 20250 \\text{\n(nghìn đồng).}\n\\end{aligned}\\]<\/span><\/p>\n<p>Dấu bằng xảy ra khi <span class=\"math inline\">\\(m = 3\\)<\/span>, tương\nứng với giá bán:<\/p>\n<p><span class=\"math display\">\\[\\begin{aligned}\n300 - 5 \\cdot 3 &amp;=  285 \\text{ (nghìn đồng/kg).}\n\\end{aligned}\\]<\/span>"}];
    const IS_STUDENT = true;

    let currentIndex = 0;

    function showToast(msg) {
      const t = document.getElementById('ios-toast');
      if (!t) return;
      t.innerText = msg;
      t.classList.remove('opacity-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add('opacity-0'), 2800);
    }

    function saveStateToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          currentIndex,
          userAnswers,
          studentData,
          timerSeconds,
          timerRunning,
          themeIndex: currentThemeIndex
        }));
      } catch (e) {}
    }

    function loadStateFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const st = JSON.parse(raw);
        if (st && typeof st === 'object') {
          if (typeof st.currentIndex === 'number' && st.currentIndex >= 0 && st.currentIndex < SLIDES.length) {
            currentIndex = st.currentIndex;
          }
          if (st.userAnswers && typeof st.userAnswers === 'object') {
            userAnswers = st.userAnswers;
          }
          if (st.studentData && typeof st.studentData === 'object') {
            studentData = st.studentData;
          }
          if (typeof st.timerSeconds === 'number' && st.timerSeconds > 0) {
            timerSeconds = st.timerSeconds;
          }
          if (typeof st.timerRunning === 'boolean') {
            timerRunning = st.timerRunning;
          }
          if (typeof st.themeIndex === 'number') {
            currentThemeIndex = st.themeIndex % 3;
            document.body.setAttribute('data-theme', themes[currentThemeIndex]);
            document.getElementById('theme-btn-icon').innerText = themeIcons[currentThemeIndex];
            document.getElementById('theme-btn-label').innerText = themeLabels[currentThemeIndex];
          }
        }
      } catch (e) {}
    }

    function resetExamProgress() {

          wrap.className = "space-y-3";
          wrap.innerHTML = `
            <input type="text" placeholder="Nhập đáp số..." 
              class="ios-input w-full p-3.5 sm:p-4 rounded-xl sm:rounded-2xl box-bg border-2 border-indigo-500/40 text-base md:text-lg font-black text-amber-400 focus:outline-none focus:border-indigo-400 shadow-inner"
              value="${userVal.replace(/"/g, '&quot;')}"
              oninput="userAnswers[${s.id}][0] = this.value; saveStateToStorage(); updateTocGrid();"
            />
          `;
          if (showSol) {
            wrap.innerHTML += `
              <div class="p-3 sm:p-4 rounded-xl sm:rounded-2xl bg-emerald-500/20 border-2 border-emerald-500/50 text-emerald-300 text-sm md:text-base font-bold flex items-center gap-2.5 shadow-lg">
                <i class="fa-solid fa-circle-check text-lg text-emerald-400"></i>
                <span>Đáp số chuẩn: <b class="text-emerald-200 text-base md:text-lg ml-1">${s.correctAnswer}</b></span>
              </div>
            `;
          }
          area.appendChild(wrap);
        } 
        /* ========== 4. TỰ LUẬN (\bt) ========== */
        else {
          const essayList = s.essayItems && s.essayItems.length > 0 ? s.essayItems : [{label: 'Đáp số / Kết quả', text: ''}];
          if (!userAnswers[s.id] || typeof userAnswers[s.id] !== 'object') userAnswers[s.id] = {};

          essayList.forEach((item, idx) => {
            const wrap = document.createElement('div');
            wrap.className = "mb-2.5 sm:mb-3 space-y-1.5";
            wrap.innerHTML = `
              <div class="text-sm font-bold text-indigo-300">${item.label}:</div>
              <input type="text" placeholder="Nhập kết quả cho ${item.label}..."
                class="ios-input w-full p-3.5 sm:p-4 rounded-xl sm:rounded-2xl box-bg border-2 border-indigo-500/40 text-base md:text-lg font-black text-amber-400 focus:outline-none focus:border-indigo-400 shadow-inner"
                value="${(userAnswers[s.id][idx] || "").replace(/"/g, '&quot;')}"
                oninput="userAnswers[${s.id}][${idx}] = this.value; saveStateToStorage(); updateTocGrid();"
              />
            `;
            area.appendChild(wrap);
          });
        }
      }

      const solBox = document.getElementById('solution-box');
      const btnSol = document.getElementById('btn-sol-toggle');
      if (showSol) {
        solBox.classList.remove('hidden');
        btnSol.innerHTML = '<i class="fa-solid fa-eye-slash mr-1.5"></i> Ẩn Lời giải';
      } else {
        solBox.classList.add('hidden');
        btnSol.innerHTML = '<i class="fa-solid fa-lock mr-1.5"></i> Xem Lời giải';
      }

      const mainScroll = document.getElementById('main-content-scroll');
      if (mainScroll) mainScroll.scrollTop = 0;

      updateTocGrid();
      renderMath();
    }

    function setTF(sid, idx, val) {
      if (showSol) return;
      if (!userAnswers[sid]) userAnswers[sid] = {};
      userAnswers[sid][idx] = val;
      saveStateToStorage();
      renderSlide();
    }

    function nextSlide() { if (currentIndex < SLIDES.length - 1) { currentIndex++; showSol = false; saveStateToStorage(); renderSlide(); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; showSol = false; saveStateToStorage(); renderSlide(); } }

    function toggleTocDrawer() {
      const drawer = document.getElementById('toc-drawer');
      const overlay = document.getElementById('toc-overlay');
      const isClosed = drawer.classList.contains('translate-x-full');
      if (isClosed) {
        drawer.classList.remove('translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        drawer.classList.add('translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    function calculateScore() {
      let earned = 0, total = 0;
      SLIDES.forEach(s => {
        if (s.isTheorySlide || s.isCoverSlide) return;
        total += 1;
        const ans = userAnswers[s.id];
        if (s.type === 'MCQ' && ans === s.correctIndex) earned += 1;
        else if (s.type === 'SA' && ans && ans[0] && ans[0].trim().toLowerCase() === (s.correctAnswer||'').trim().toLowerCase()) earned += 1;
        else if (s.type === 'TF' && ans) {
          let itemPts = 0;
          (s.tfItems||[]).forEach((item, i) => { if (ans[i] === item.correct) itemPts += 0.25; });
          earned += itemPts;
        }
      });
      return total > 0 ? (earned / total) * 10 : 0;
    }

    function toggleSolution() {
      if (IS_STUDENT && LOCK_SOLUTION && !showSol) {
        const score = calculateScore();
        if (score < 3.0) {
          alert("🔒 LỜI GIẢI ĐÃ BỊ KHÓA! Bạn cần đạt tối thiểu 3.0 điểm để mở xem Lời giải chi tiết. (Điểm hiện tại: " + score.toFixed(1) + "/10)");
          return;
        }
      }
      showSol = !showSol;
      renderSlide();

      if (showSol) {
        setTimeout(() => {
          const solBox = document.getElementById('solution-box');
          if (solBox) solBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 150);
      }
    }

    function showScoreModal() {
      const score = calculateScore();
      document.getElementById('score-val').innerText = score.toFixed(1);

      const infoBox = document.getElementById('score-student-info');
      if (studentData.name || studentData.studentClass) {
        infoBox.innerHTML = `Thí sinh: <b>${studentData.name || 'Chưa nhập'}</b> - Lớp: <b>${studentData.studentClass || 'Chưa nhập'}</b> - SBD: <b>${studentData.sbd || 'N/A'}</b>`;
      } else {
        infoBox.innerHTML = `Thí sinh tự do (Chưa nhập tên trên Trang Bìa)`;
      }

      document.getElementById('score-msg').innerText = score < 3.0 && LOCK_SOLUTION ? 
        "⚠️ Điểm số dưới 3.0. Hệ thống đã khóa Lời giải chi tiết để bạn rèn luyện lại." : "🎉 Bạn đã hoàn thành bài thi!";
      document.getElementById('modal-score').classList.remove('hidden');
    }

    function updateFullscreenUi(active) {
      const icon = document.getElementById('icon-fullscreen');
      const label = document.getElementById('label-fullscreen');
      if (icon) icon.className = active ? "fa-solid fa-compress text-xs sm:text-sm" : "fa-solid fa-expand text-xs sm:text-sm";
      if (label) label.innerText = active ? "Thu nhỏ" : "Toàn màn hình";
    }

    function toggleFullScreen() {
      const doc = document.documentElement;
      const canNativeFs = !!(doc.requestFullscreen || doc.webkitRequestFullscreen) &&
                          (document.fullscreenEnabled !== false && document.webkitFullscreenEnabled !== false);

      if (canNativeFs) {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          const p = doc.requestFullscreen ? doc.requestFullscreen() : doc.webkitRequestFullscreen();
          if (p && typeof p.catch === 'function') {
            p.catch(() => {
              document.body.classList.toggle('ios-focus-mode');
              updateFullscreenUi(document.body.classList.contains('ios-focus-mode'));
            });
          }
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      } else {
        const active = document.body.classList.toggle('ios-focus-mode');
        updateFullscreenUi(active);
        if (active) {
          showToast("Đã bật chế độ Tập trung tràn màn hình!");
        }
      }
    }

    document.addEventListener('fullscreenchange', () => updateFullscreenUi(!!document.fullscreenElement));
    document.addEventListener('webkitfullscreenchange', () => updateFullscreenUi(!!document.webkitFullscreenElement));

    let currentFigureZoom = 1.0;

    function openFigureZoom(containerEl) {
      const svgEl = containerEl.querySelector('svg');
      if (!svgEl) return;
      const zoomContent = document.getElementById('figure-zoom-content');
      zoomContent.innerHTML = '';
      const cloned = svgEl.cloneNode(true);
      cloned.style.maxWidth = '92vw';
      cloned.style.width = 'min(92vw, 680px)';
      cloned.style.height = 'auto';
      zoomContent.appendChild(cloned);
      currentFigureZoom = 1.0;
      applyFigureZoom();
      document.getElementById('modal-figure-zoom').classList.remove('hidden');
    }

    function adjustFigureZoom(delta) {
      currentFigureZoom = Math.min(2.75, Math.max(0.75, currentFigureZoom + delta));
      applyFigureZoom();
    }

    function resetFigureZoom() {
      currentFigureZoom = 1.0;
      applyFigureZoom();
    }

    function applyFigureZoom() {
      const zoomContent = document.getElementById('figure-zoom-content');
      const lbl = document.getElementById('zoom-level-label');
      if (zoomContent) zoomContent.style.transform = `scale(${currentFigureZoom})`;
      if (lbl) lbl.innerText = Math.round(currentFigureZoom * 100) + '%';
    }

    function closeFigureZoom() {
      document.getElementById('modal-figure-zoom').classList.add('hidden');
    }

    (function setupTouchSwipe() {
      const target = document.getElementById('main-content-scroll');
      if (!target) return;
      let startX = 0, startY = 0, startTime = 0, ignoreSwipe = false;

      target.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) {
          ignoreSwipe = true;
          return;
        }
        const el = e.target;
        if (el && el.closest('input, textarea, select, .table-scroll-wrap, .immini-right, mjx-container[display="true"]')) {
          ignoreSwipe = true;
          return;
        }
        ignoreSwipe = false;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startTime = Date.now();
      }, { passive: true });

      target.addEventListener('touchend', function(e) {
        if (ignoreSwipe || !e.changedTouches || e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        const dt = Date.now() - startTime;

        if (dt < 550 && Math.abs(dx) > 68 && Math.abs(dx) > Math.abs(dy) * 1.6) {
          if (dx < 0) nextSlide();
          else prevSlide();
        }
      }, { passive: true });
    })();

    document.addEventListener('keydown', function(e) {
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea') return;

      if (e.key === 'Escape') {
        closeFigureZoom();
        const drawer = document.getElementById('toc-drawer');
        if (drawer && !drawer.classList.contains('translate-x-full')) toggleTocDrawer();
        return;
      }

      const scrollContainer = document.getElementById('main-content-scroll');

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (scrollContainer) scrollContainer.scrollTop -= 100;
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (scrollContainer) scrollContainer.scrollTop += 100;
      }
    });

    if (EXAM_INFO.examName) document.getElementById('hdr-exam-title').innerText = EXAM_INFO.examName;
    if (EXAM_INFO.school) document.getElementById('hdr-school-name').innerText = EXAM_INFO.school;
    loadStateFromStorage();
    updateTimerDisplay();
    renderSlide();
  </script>
</body>
</html>
